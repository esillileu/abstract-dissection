domain: deepscratch.ds1.implemented
kind: supervised_classification
run: {experiment_id: e15, group_id: GT11, protocol: MNIST CNN-protocol model comparison, protocol_version: book-source-v1, recipe_id: ds1-gt11-model-comparison, structure_signature: mnist-model-comparison}
execution: {mode: seeded, default_device: cuda:0}
seed_policy: {seed_set: research_v1, seed_count: 10, paired_execution: true}
dataset: {id: mnist-flat-full, source: mnist, flatten: true, train_limit: 60000, test_limit: 10000}
loader: {batch_size: 100, drop_last: false, sampling_method: with_replacement}
model: {name: MLP}
optimizer: {name: adam, learning_rate: 0.001}
objective: {name: SoftmaxCrossEntropy, reduction: mean}
budget: {max_epochs: 20}
recording:
  evaluation_sources:
    - {id: mnist-train-first-1000, split: train, kind: first_n, count: 1000}
    - {id: mnist-test-first-1000, split: test, kind: first_n, count: 1000}
    - {id: mnist-test-full, split: test, kind: full}
  triggers:
    - {type: epoch_first_update, sources: [mnist-train-first-1000, mnist-test-first-1000]}
    - {type: terminal, sources: [mnist-test-full]}
numerics: {dtype: float64, backend: cupy, device: cuda:0}
checkpoint: {save_final: true, save_on_eval: false, format: v2}
profiling: {enabled: false}
tracking: {enabled: true, experiment: deepscratch.ds1}
variants:
  SIMPLE-CNN-HE:
    dataset: {id: mnist-image-full, flatten: false}
    model: {name: SimpleCNN, input_channels: 1, image_size: 28, num_classes: 10, conv_channels: 30, kernel_size: 5, hidden_size: 100, initializer: he}
  TWO-LAYER-NET-ADAM:
    model: {name: TwoLayerNet, input_size: 784, hidden_size: 50, output_size: 10, initializer: he, gradient_method: backprop}
  MLP-EXT-NO-REG:
    model: {name: MLP, input_size: 784, hidden_sizes: [100, 100, 100, 100, 100, 100], output_size: 10, activation: relu, initializer: he, use_batchnorm: true, dropout_ratio: 0.0}
