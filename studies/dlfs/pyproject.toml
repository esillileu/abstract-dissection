[project]
name = "dlfs"
version = "0.1.0"
description = "Deep Learning from Scratch (Vol 1 & 2) independent reproductions"
requires-python = ">=3.11, <3.12"
dependencies = [
    "cupy-cuda12x[ctk]>=14.1.1",
    "numpy>=2.0.0",
    "repro-core",
    "repro-mlflow",
    "deepscratch",
    "scikit-learn>=1.5.0",
]

[project.entry-points."repro.studies"]
dlfs = "dlfs.plugin:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
only-packages = true
