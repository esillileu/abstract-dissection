domain: f2.w2v1
kind: word2vec
execution: {mode: seeded, default_device: cpu}
seed_policy: {seed_set: research_v1, seed_count: 3}
identity: {planned_run_slot_id: resolved-from-atomic-run-and-seed, seed: 1, study: table7}
corpus: {}
# Reconstruction decision: Table 7 states 640d model trained on 50M words provided in [32];
# vocabulary min_count: 5 matches canonical W2V1 conventions.
vocabulary: {initial_capacity: 1000, hash_capacity: 30000000, min_count: 5, max_lexical_words: 1000000}
training:
  objective_kind: hierarchical_softmax
  embedding_dimension: 640
  epochs: 1
  thread_count: 20
  learning_rate_update_interval: 10000
  observation_interval: 100000
  initial_learning_rate: 0.025
  subsampling_threshold: 0.0
  negative_sample_count: 0
  rng_algorithm: lcg
  negative_table_size: 100
  sigmoid_table_size: 1000
  sigmoid_max: 6.0
  hs_out_of_range_policy: skip

checkpoint: {save_latest: true, save_final: true, best_payload: full}
tracking: {experiment: f2.w2v1}

resources:
  holmes: &holmes
    identity: {execution_plan_id: w2v1-table7-holmes-r1}

conditions:
  skipgram-d640-w50m: &skipgram-d640-w50m
    experiment_spec_id: w2v1-msr-sentence-skipgram
    corpus: {path: data/f2/corpus/holmes.txt, lexical_token_budget: 50000000}
    training: {model_kind: skip_gram, window_radius: 10, context_policy: dynamic}

variants:
  holmes--skipgram-d640-w50m: {<<: [*holmes, *skipgram-d640-w50m]}
