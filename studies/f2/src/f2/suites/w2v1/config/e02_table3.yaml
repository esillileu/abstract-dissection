domain: f2.w2v1
kind: word2vec
execution: {mode: seeded, default_device: cpu}
seed_policy: {seed_set: research_v1, seed_count: 3}
identity: {planned_run_slot_id: resolved-from-atomic-run-and-seed, seed: 1, study: table3}
corpus: {}
vocabulary: {initial_capacity: 1000, hash_capacity: 30000000, min_count: 1, max_lexical_words: 82000}
training:
  objective_kind: hierarchical_softmax
  embedding_dimension: 640
  epochs: 3
  thread_count: 20
  observation_interval: 100000
  initial_learning_rate: 0.025
  rng_algorithm: lcg
checkpoint: {save_latest: true, save_final: true, best_payload: full}
tracking: {experiment: f2.w2v1}

resources:
  wmt: &wmt
    identity: {execution_plan_id: w2v1-reconstruction-r2}
  lm1b: &lm1b
    identity: {execution_plan_id: w2v1-lm1b-reconstruction-r1}
  umbc: &umbc
    identity: {execution_plan_id: w2v1-umbc-reconstruction-r1}

conditions:
  cbow-d640-w320m: &cbow-d640-w320m
    experiment_spec_id: w2v1-table3-cbow
    corpus: {lexical_token_budget: 320000000}
    vocabulary: {initial_capacity: 1000, hash_capacity: 30000000, min_count: 1, max_lexical_words: 82000}
    training: &word2vec_training
      learning_rate_update_interval: 10000
      subsampling_threshold: 0.0
      negative_sample_count: 0
      negative_table_size: 100
      sigmoid_table_size: 1000
      sigmoid_max: 6.0
      hs_out_of_range_policy: skip
      model_kind: cbow
      window_radius: 4
      context_policy: fixed
      embedding_dimension: 640
      observation_interval: 100000

  skipgram-d640-w320m: &skipgram-d640-w320m
    experiment_spec_id: w2v1-table3-skipgram
    corpus: {lexical_token_budget: 320000000}
    vocabulary: {initial_capacity: 1000, hash_capacity: 30000000, min_count: 1, max_lexical_words: 82000}
    training:
      <<: *word2vec_training
      model_kind: skip_gram
      window_radius: 10
      context_policy: dynamic
      embedding_dimension: 640
      observation_interval: 100000

  nnlm-d640-h640-n8-w320m: &nnlm-d640-h640-n8-w320m
    experiment_spec_id: w2v1-table3-nnlm
    corpus: {lexical_token_budget: 320000000}
    vocabulary: {initial_capacity: 1000, hash_capacity: 30000000, min_count: 1, max_lexical_words: 82000}
    # Reconstruction decision (not paper-specified): tanh, 3 epochs, AdaGrad gamma=0.05,
    # epsilon=1e-6, summed mini-batches of 250 targets, 20 local replicas, 4 PS shards,
    # queue_capacity=128 and fetch/push once per batch. No separate LR decay.
    # Initialization: embeddings uniform +/-0.5/D, hidden Xavier uniform, zero bias/HS output.
    # History resets at sentence boundaries/OOV; targets require a full history; no subsampling.
    # These decisions are also recorded in the existing w2v1-table3-nnlm catalog notes.
    training:
      model_kind: feedforward_nnlm
      embedding_dimension: 640
      hidden_dimension: 640
      history_length: 8
      hidden_activation: tanh
      epochs: 3
      thread_count: 20
      objective_kind: hierarchical_softmax
      initial_learning_rate: 0.05
      observation_interval: 100000
      rng_algorithm: lcg
    distribution:
      mode: downpour
      parameter_server_shards: 4
      mini_batch_targets: 250
      adagrad_gamma: 0.05
      adagrad_epsilon: 1.0e-6
      queue_capacity: 128
      fetch_interval: 1
      push_interval: 1

variants:
  wmt--cbow-d640-w320m: {<<: [*wmt, *cbow-d640-w320m]}
  lm1b--cbow-d640-w320m: {<<: [*lm1b, *cbow-d640-w320m]}
  umbc--cbow-d640-w320m: {<<: [*umbc, *cbow-d640-w320m]}
  wmt--skipgram-d640-w320m: {<<: [*wmt, *skipgram-d640-w320m]}
  lm1b--skipgram-d640-w320m: {<<: [*lm1b, *skipgram-d640-w320m]}
  umbc--skipgram-d640-w320m: {<<: [*umbc, *skipgram-d640-w320m]}
  wmt--nnlm-d640-h640-n8-w320m: {<<: [*wmt, *nnlm-d640-h640-n8-w320m]}
  lm1b--nnlm-d640-h640-n8-w320m: {<<: [*lm1b, *nnlm-d640-h640-n8-w320m]}
  umbc--nnlm-d640-h640-n8-w320m: {<<: [*umbc, *nnlm-d640-h640-n8-w320m]}
