domain: f2.w2v1
kind: word2vec
execution: {mode: seeded, default_device: cpu}
seed_policy: {seed_set: research_v1, seed_count: 3}
identity: {planned_run_slot_id: resolved-from-atomic-run-and-seed, seed: 1}
corpus: {}
vocabulary: {initial_capacity: 16, hash_capacity: 128, min_count: 1, max_lexical_words: 30000}
training:
  model_kind: cbow
  objective_kind: hierarchical_softmax
  embedding_dimension: 50
  window_radius: 4
  context_policy: fixed
  epochs: 3
  thread_count: 20
  learning_rate_update_interval: 10000
  observation_interval: 2
  initial_learning_rate: 0.025
  subsampling_threshold: 0.0
  negative_sample_count: 0
  rng_algorithm: lcg
  negative_table_size: 100
  sigmoid_table_size: 1000
  sigmoid_max: 6.0
  hs_out_of_range_policy: skip
checkpoint: {save_latest: true, save_final: true, best_payload: full}
tracking: {experiment: f2.w2v1}

resources:
  wmt: &wmt
    identity: {execution_plan_id: w2v1-reconstruction-r2}
  lm1b: &lm1b
    identity: {execution_plan_id: w2v1-lm1b-reconstruction-r1}
  umbc: &umbc
    identity: {execution_plan_id: w2v1-umbc-reconstruction-r1}

conditions:
  d50-w24m: &d50-w24m {corpus: {lexical_token_budget: 24000000}, vocabulary: {initial_capacity: 1000, hash_capacity: 30000000, min_count: 1, max_lexical_words: 30000}, training: {observation_interval: 100000}}
