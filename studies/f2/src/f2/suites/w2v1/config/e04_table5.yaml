domain: f2.w2v1
kind: word2vec
execution: {mode: seeded, default_device: cpu}
seed_policy: {seed_set: research_v1, seed_count: 3}
identity: {planned_run_slot_id: resolved-from-atomic-run-and-seed, seed: 1, study: table5}
corpus: {}
# Reconstruction decision: Table 5 does not state its vocabulary cap; matches Table 4.
vocabulary: {initial_capacity: 1000, hash_capacity: 30000000, min_count: 1, max_lexical_words: 1000000}
training:
  objective_kind: hierarchical_softmax
  epochs: 1
  thread_count: 20
  learning_rate_update_interval: 10000
  observation_interval: 100000
  initial_learning_rate: 0.025
  subsampling_threshold: 0.0
  negative_sample_count: 0
  rng_algorithm: lcg
  negative_table_size: 100
  sigmoid_table_size: 1000
  sigmoid_max: 6.0
  hs_out_of_range_policy: skip
checkpoint: {save_latest: true, save_final: true, best_payload: full}
tracking: {experiment: f2.w2v1}

resources:
  wmt: &wmt
    identity: {execution_plan_id: w2v1-table5-wmt-r1}

conditions:
  cbow-d300-w783m-ep1: &cbow-d300-w783m-ep1
    experiment_spec_id: w2v1-google-news-cbow-scale
    corpus: {lexical_token_budget: 783000000}
    training: {model_kind: cbow, embedding_dimension: 300, window_radius: 4, context_policy: fixed}
  cbow-d300-w1600m-ep1: &cbow-d300-w1600m-ep1
    experiment_spec_id: w2v1-google-news-cbow-scale
    corpus: {lexical_token_budget: 1600000000}
    training: {model_kind: cbow, embedding_dimension: 300, window_radius: 4, context_policy: fixed}
  cbow-d600-w783m-ep1: &cbow-d600-w783m-ep1
    experiment_spec_id: w2v1-google-news-cbow-scale
    corpus: {lexical_token_budget: 783000000}
    training: {model_kind: cbow, embedding_dimension: 600, window_radius: 4, context_policy: fixed}

  skipgram-d300-w783m-ep1: &skipgram-d300-w783m-ep1
    experiment_spec_id: w2v1-google-news-skipgram-scale
    corpus: {lexical_token_budget: 783000000}
    training: {model_kind: skip_gram, embedding_dimension: 300, window_radius: 10, context_policy: dynamic}
  skipgram-d300-w1600m-ep1: &skipgram-d300-w1600m-ep1
    experiment_spec_id: w2v1-google-news-skipgram-scale
    corpus: {lexical_token_budget: 1600000000}
    training: {model_kind: skip_gram, embedding_dimension: 300, window_radius: 10, context_policy: dynamic}
  skipgram-d600-w783m-ep1: &skipgram-d600-w783m-ep1
    experiment_spec_id: w2v1-google-news-skipgram-scale
    corpus: {lexical_token_budget: 783000000}
    training: {model_kind: skip_gram, embedding_dimension: 600, window_radius: 10, context_policy: dynamic}

variants:
  wmt--cbow-d300-w783m-ep1: {<<: [*wmt, *cbow-d300-w783m-ep1]}
  wmt--cbow-d300-w1600m-ep1: {<<: [*wmt, *cbow-d300-w1600m-ep1]}
  wmt--cbow-d600-w783m-ep1: {<<: [*wmt, *cbow-d600-w783m-ep1]}
  wmt--skipgram-d300-w783m-ep1: {<<: [*wmt, *skipgram-d300-w783m-ep1]}
  wmt--skipgram-d300-w1600m-ep1: {<<: [*wmt, *skipgram-d300-w1600m-ep1]}
  wmt--skipgram-d600-w783m-ep1: {<<: [*wmt, *skipgram-d600-w783m-ep1]}
