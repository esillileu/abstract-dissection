[project]
name = "f2"
version = "0.1.0"
description = "Word2Vec 2013 paper reproduction & Common Crawl corpus feasibility study"
requires-python = ">=3.11, <3.12"
dependencies = [
    "duckdb>=1.0.0",
    "langdetect>=1.0.9",
    "psycopg[binary]>=3.1.0",
    "pyarrow>=15.0.0",
    "repro-core",
    "sqlalchemy>=2.0.0",
    "trafilatura>=1.8.0",
    "warcio>=0.2.1",
]

[project.entry-points."repro.studies"]
f2 = "f2.plugin:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
only-packages = true
