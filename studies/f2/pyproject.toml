[project]
name = "f2"
version = "0.1.0"
description = "Word2Vec 2013 reproduction, corpus preprocessing, and catalog study"
requires-python = ">=3.12, <3.13"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "repro-core",
    "sqlalchemy>=2.0.0",
    "repro-io",
    "w2v",
    "python-dotenv>=1.0",
]

[project.entry-points."repro.studies"]
f2 = "f2.plugin:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
only-packages = true
