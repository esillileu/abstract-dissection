[project]
name = "f2-cc"
version = "0.1.0"
description = "Common Crawl corpus acquisition study for F2"
requires-python = ">=3.11, <3.12"
dependencies = [
    "duckdb>=1.0.0",
    "langdetect>=1.0.9",
    "psycopg[binary]>=3.1.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0",
    "repro-core",
    "repro-io",
    "trafilatura>=1.8.0",
]

[project.entry-points."repro.studies"]
f2-cc = "f2_cc.plugin:PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
only-packages = true
