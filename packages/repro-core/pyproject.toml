[project]
name = "repro-core"
version = "0.1.0"
description = "Core runtime infrastructure and CLI for paper reproductions"
requires-python = ">=3.11, <3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "psutil>=7.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.68.0",
    "typer>=0.27.0",
]

[project.scripts]
repro = "repro_core.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
only-packages = true
