[project]
name = "repro-mlflow"
version = "0.1.0"
description = "MLflow tracking and artifact management adapter for paper reproductions"
requires-python = ">=3.11, <3.12"
dependencies = [
    "mlflow>=3.0.0",
    "pyyaml>=6.0.0",
    "repro-core",
    "typer>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
only-packages = true
