[project]
name = "repro-io"
version = "0.1.0"
description = "Independent HTTP, object transfer and archive/index parsing"
requires-python = ">=3.11, <3.12"
dependencies = ["requests>=2.31", "warcio>=0.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repro_io"]
