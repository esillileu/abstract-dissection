[project]
name = "mlprosection"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11, <3.12"
dependencies = [
    "cupy-cuda12x>=14.1.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.0",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
tracking = [
    "mlflow>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
only-packages = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
extend-exclude = ["01_deep-learning-from-base"]
