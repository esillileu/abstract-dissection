services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow-data/artifacts
      - --allowed-hosts
      - localhost:5000,127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/mlflow-data
    restart: unless-stopped
