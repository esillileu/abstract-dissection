# e01 = GT01: book toy-CBOW training.
kind: word2vec
dataset: {id: DS-TOY-W2V, name: toy sentence, text: "You say goodbye and I say hello.", window_size: 1}
loader: {batch_size: 3, shuffle: false}
model: {family: word2vec, architecture: cbow, objective: full_softmax, embedding_size: 5}
optimizer: {name: adam, learning_rate: 0.001}
loss: {name: summed_prediction_term_full_softmax, reduction: mean}
training: {max_epochs: 1000, entrypoint: exp/ds2/config/e01_toy_word2vec.yaml}
recording: {source_curve: {kind: interval_mean_loss, every_updates: 20, phase: post_update, index_origin: 0}}
evaluation: {primary_metric: final/train/loss}
numerics: {dtype: float32, backend: numpy, device: cpu, deterministic: true}
checkpoint: {save_final: true, save_best: false, format: npz}
profiling: {enabled: false}
policy: {seed_set: research_v1, seed_count: 10, paired_execution: true}
tracking: {enabled: true, experiment: ds2}
variants:
  W2V-TOY-CBOW-FULL: {atomic_run_id: W2V-TOY-CBOW-FULL, experiment_ids: [e01], execution_group_id: GT01, recipe_id: ds2-gt01-toy-cbow, structure_signature: toy-cbow-full-softmax-w1-e5}
