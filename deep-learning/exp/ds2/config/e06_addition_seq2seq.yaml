# e06 = GT06: character addition Seq2seq comparison.
kind: seq2seq
dataset: {id: DS-SEQ-ADD, file: addition.txt, name: character addition, split_seed: 1984, split_algorithm: legacy_numpy_randomstate}
loader: {batch_size: 128, shuffle: true}
optimizer: {name: adam, learning_rate: 0.001}
loss: {name: time_softmax_cross_entropy, reduction: mean}
training: {max_epochs: 25, entrypoint: exp/ds2/config/e06_addition_seq2seq.yaml}
recording: {source_curve: {kind: full_test_exact_match, every_epochs: 1, plot_index: epoch_minus_one}, predictions: {split: test, count: 10}}
evaluation: {primary_metric: final/test/exact_match, decode: greedy, test_every_epochs: 1}
numerics: {dtype: float32, backend: numpy, device: cpu, deterministic: true}
checkpoint: {save_final: true, save_best: true, format: npz}
profiling: {enabled: false}
policy: {seed_set: research_v1, seed_count: 10, paired_execution: true, max_grad: 5.0}
tracking: {enabled: true, experiment: ds2}
variants:
  SEQA-VAN-FWD: {atomic_run_id: SEQA-VAN-FWD, experiment_ids: [e06], execution_group_id: GT06, recipe_id: ds2-gt06-addition, structure_signature: addition-seq2seq-16-128, model: {alias: Seq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: false}}
  SEQA-VAN-REV: {atomic_run_id: SEQA-VAN-REV, experiment_ids: [e06], execution_group_id: GT06, recipe_id: ds2-gt06-addition, structure_signature: addition-seq2seq-16-128, model: {alias: Seq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: true}}
  SEQA-PEEKY-FWD: {atomic_run_id: SEQA-PEEKY-FWD, experiment_ids: [e06], execution_group_id: GT06, recipe_id: ds2-gt06-addition, structure_signature: addition-peeky-16-128, model: {alias: PeekySeq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: false}}
  SEQA-PEEKY-REV: {atomic_run_id: SEQA-PEEKY-REV, experiment_ids: [e06], execution_group_id: GT06, recipe_id: ds2-gt06-addition, structure_signature: addition-peeky-16-128, model: {alias: PeekySeq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: true}}
