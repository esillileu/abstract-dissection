# e04 = GT04: source LSTM RNNLM graph reproduction.
kind: language_modeling
dataset: {id: DS-PTB, name: Penn Treebank}
loader: {batch_size: 20, time_size: 35}
model: {alias: Rnnlm, wordvec_size: 100, hidden_size: 100}
optimizer: {name: sgd, learning_rate: 20.0}
scheduler: {name: constant}
loss: {name: time_softmax_cross_entropy, reduction: mean}
training: {max_epochs: 4, entrypoint: exp/ds2/config/e04_ptb_lstm_rnnlm.yaml}
recording: {source_curve: {kind: train_perplexity, every_updates: 20, phase: post_update, index_origin: 0}}
evaluation: {primary_metric: final/test/perplexity, valid_every_epochs: 0, test_every_epochs: 0, test_at_end: true}
numerics: {dtype: float32, backend: numpy, device: cpu, deterministic: true}
checkpoint: {save_final: true, save_best: false, format: npz}
profiling: {enabled: false}
policy: {seed_set: research_v1, seed_count: 10, paired_execution: true, max_grad: 0.25}
tracking: {enabled: true, experiment: ds2}
variants:
  LM-LSTM: {atomic_run_id: LM-LSTM, experiment_ids: [e04], execution_group_id: GT04, recipe_id: ds2-gt04-ptb-lstm, structure_signature: ptb-lstm-100}
