domain: ds2
kind: word2vec
run: {experiment_id: e02, group_id: GT02, protocol: PTB Word2Vec, recipe_id: ds2-gt02-ptb-word2vec, structure_signature: ptb-word2vec-w5-e100}
execution: {mode: seeded, default_device: cuda:0}
seed_policy: {seed_set: research_v1, seed_count: 10, paired_execution: true}
dataset: {id: DS-PTB-TRAIN, source: ptb_train, window_size: 5}
loader: {batch_size: 100, drop_last: true}
model: {name: CBOW, embedding_size: 100}
objective: {name: NegativeSampling, reduction: mean, book_reduction: sum_terms_mean_examples, negative_samples: 5, sampler: {algorithm: conditional_cdf_target_exclusion_v1, power: 0.75}}
optimizer: {name: adam, learning_rate: 0.001}
budget: {max_epochs: 10}
recording:
  source_curve: {kind: interval_mean_loss, every_updates: 20, reducer: mean, plot_index: zero_based_append}
  evaluations: []
numerics: {dtype: float32, backend: cupy, device: cuda:0, deterministic: true}
checkpoint: {save_final: true, save_best: false, format: v2}
profiling: {enabled: false}
tracking: {enabled: true, experiment: ds2}
variants:
  W2V-PTB-CBOW-NS: {run: {structure_signature: ptb-cbow-negative-sampling-w5-e100}, model: {name: CBOW}, objective: {name: NegativeSampling}}
  W2V-PTB-SKIPGRAM-NS: {run: {structure_signature: ptb-skipgram-negative-sampling-w5-e100}, model: {name: SkipGram}, objective: {name: NegativeSampling}}
  W2V-PTB-CBOW-FULL: {run: {structure_signature: ptb-cbow-full-softmax-w5-e100}, model: {name: CBOW}, objective: {name: SoftmaxWithLoss}}
  W2V-PTB-SKIPGRAM-FULL: {run: {structure_signature: ptb-skipgram-full-softmax-w5-e100}, model: {name: SkipGram}, objective: {name: SoftmaxWithLoss}}
