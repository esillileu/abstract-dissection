# e06 = GT06: book SimpleConvNet recipe.
kind: supervised_classification
dataset: {id: mnist-image-full, name: MNIST, flatten: false, train_limit: 60000, test_limit: 10000}
loader: {batch_size: 100, drop_last: false, sampling_method: with_replacement}
model: {alias: SimpleCNN, input_channels: 1, image_size: 28, num_classes: 10, conv_channels: 30, kernel_size: 5, hidden_size: 100, initializer: 'std:0.01'}
optimizer: {name: adam, learning_rate: 0.001}
loss: {name: SoftmaxWithLoss, reduction: mean}
training: {max_epochs: 20, entrypoint: exp/ds1/config/e06_mnist_simple_cnn.yaml}
evaluation: {primary_metric: test/accuracy, schedule: {on_epoch_first_update: {sets: [train-first-1000, test-first-1000]}, on_train_end: {sets: [test-full]}}}
numerics: {dtype: float64, backend: numpy, device: cpu}
checkpoint: {save_final: true, save_on_eval: false, format: npz}
profiling: {enabled: false}
policy: {seed_set: research_v1, seed_count: 10, paired_execution: true}
tracking: {enabled: true, experiment: ds1, upload_checkpoint: false}
variants:
  CNN-SIMPLE-BOOK: {atomic_run_id: CNN-SIMPLE-BOOK, experiment_ids: [e06], execution_group_id: GT06, recipe_id: ds1-gt06-simple-cnn, structure_signature: mnist-simplecnn-c30-fc100}
