# e05 = GT05: BatchNorm × log-spaced initialization scale.
kind: supervised_classification
dataset: {id: mnist-train-1000, name: MNIST, flatten: true, train_limit: 1000, test_limit: 10000, train_evaluation_size: 1000}
loader: {batch_size: 100, drop_last: false, sampling_method: with_replacement}
model: {alias: MLP, input_size: 784, hidden_sizes: [100, 100, 100, 100, 100], output_size: 10, activation: relu}
optimizer: {name: sgd, learning_rate: 0.01}
loss: {name: SoftmaxWithLoss, reduction: mean}
training: {max_epochs: 20, entrypoint: exp/ds1/config/e05_mnist_batchnorm_scale.yaml}
evaluation: {primary_metric: train/accuracy, schedule: {on_update: {first: true, every: 10, sets: [train-first-1000]}}}
numerics: {dtype: float64, backend: numpy, device: cpu}
checkpoint: {save_final: true, save_on_eval: false, format: npz}
profiling: {enabled: false}
policy: {seed_set: research_v1, seed_count: 10, paired_execution: true}
tracking: {enabled: true, experiment: ds1, upload_checkpoint: false}
variants:
