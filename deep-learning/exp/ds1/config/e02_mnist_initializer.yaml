# e02 = GT02: MNIST MLP initialization comparison.
kind: supervised_classification
dataset: {id: mnist-train-full, name: MNIST, flatten: true, train_limit: 60000, test_limit: 10000}
loader: {batch_size: 128, drop_last: false, sampling_method: with_replacement}
model: {alias: MLP, input_size: 784, hidden_sizes: [100, 100, 100, 100], output_size: 10, activation: relu}
optimizer: {name: sgd, learning_rate: 0.01}
loss: {name: SoftmaxWithLoss, reduction: mean}
training: {max_epochs: 5, max_updates: 2000, entrypoint: exp/ds1/config/e02_mnist_initializer.yaml}
evaluation: {primary_metric: test/accuracy, schedule: {on_epoch_end: {sets: [test-full]}}}
numerics: {dtype: float64, backend: numpy, device: cpu}
checkpoint: {save_final: true, save_on_eval: false, format: npz}
profiling: {enabled: false}
policy: {seed_set: research_v1, seed_count: 10, paired_execution: true}
tracking: {enabled: true, experiment: ds1, upload_checkpoint: false}
variants:
  MLP-INIT-STD001: {atomic_run_id: MLP-INIT-STD001, experiment_ids: [e02], execution_group_id: GT02, recipe_id: ds1-gt02-initializer, structure_signature: mnist-mlp-784-100x4-10-relu, model: {initializer: 'std:0.01'}}
  MLP-INIT-XAVIER: {atomic_run_id: MLP-INIT-XAVIER, experiment_ids: [e02], execution_group_id: GT02, recipe_id: ds1-gt02-initializer, structure_signature: mnist-mlp-784-100x4-10-relu, model: {initializer: xavier}}
  MLP-INIT-HE: {atomic_run_id: MLP-INIT-HE, experiment_ids: [e02], execution_group_id: GT02, recipe_id: ds1-gt02-initializer, structure_signature: mnist-mlp-784-100x4-10-relu, model: {initializer: he}}
