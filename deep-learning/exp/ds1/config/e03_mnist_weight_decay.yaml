domain: ds1
kind: supervised_classification
run: {experiment_id: e03, group_id: GT03, protocol: MNIST MLP weight decay, recipe_id: ds1-gt03-weight-decay, structure_signature: mnist-mlp-784-100x6-10-relu}
execution: {mode: seeded, default_device: cpu}
seed_policy: {seed_set: research_v1, seed_count: 10, paired_execution: true}
dataset: {id: mnist-train-first-300, source: mnist, flatten: true, train_limit: 300, test_limit: 10000}
loader: {batch_size: 100, drop_last: false, sampling_method: with_replacement}
model: {alias: MLP, input_size: 784, hidden_sizes: [100, 100, 100, 100, 100, 100], output_size: 10, activation: relu, initializer: he}
optimizer: {name: sgd, learning_rate: 0.01}
loss: {name: SoftmaxWithLoss, reduction: mean, phase: post_update}
budget: {max_epochs: 201, max_updates: 601}
recording:
  evaluation_sources:
    - {id: mnist-train-first-300, split: train, kind: first_n, count: 300}
    - {id: mnist-test-full, split: test, kind: full}
  triggers:
    - {type: updates, start: 1, every: 3, stop: 601, sources: [mnist-train-first-300, mnist-test-full]}
numerics: {dtype: float64, backend: numpy, device: cpu}
checkpoint: {save_final: true, save_on_eval: false, format: npz}
profiling: {enabled: false}
tracking: {enabled: true, experiment: ds1, upload_checkpoint: false}
variants:
  REG-WD-OFF: {optimizer: {name: sgd, learning_rate: 0.01, weight_decay: 0.0}}
  REG-WD-01: {optimizer: {name: sgd, learning_rate: 0.01, weight_decay: 0.1}}
