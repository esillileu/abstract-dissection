  MLP-SGD-XAVIER: {atomic_run_id: MLP-SGD-XAVIER, experiment_ids: [e04], execution_group_id: g02, recipe_id: RC-MLP, structure_signature: mnist-mlp-784-100x4-10-relu-v1, model: {initializer: xavier}, initializer: {name: xavier, seed: seed/model_init}}
  MLP-SGD-HE: {atomic_run_id: MLP-SGD-HE, experiment_ids: [e04], execution_group_id: g02, recipe_id: RC-MLP, structure_signature: mnist-mlp-784-100x4-10-relu-v1, model: {initializer: he}, initializer: {name: he, seed: seed/model_init}}
