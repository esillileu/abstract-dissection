kind: supervised_classification
dataset:
  {
    id: DS-MNIST-IMG,
    name: MNIST,
    version: official,
    flatten: false,
    train_limit: 60000,
    validation_size: 1000,
    validation_seed: 20260808,
    train_evaluation_size: 1000,
    train_evaluation_seed: 20260809,
    test_limit: 10000,
    input_shape: [1, 28, 28],
    target_shape: [],
    num_classes: 10,
    normalization: pixel_0_1,
    channel_order: NCHW,
  }
loader:
  {
    batch_size: 100,
    shuffle: true,
    drop_last: false,
    sampling_method: with_replacement,
  }
optimizer:
  { name: adam, learning_rate: 0.001, beta1: 0.9, beta2: 0.999, eps: 1.0e-7 }
scheduler: { name: constant }
loss: { name: SoftmaxWithLoss, reduction: mean }
training:
  {
    max_epochs: 20,
    log_interval: 20,
    record_first_validation_evaluation: true,
    record_step_validation_interval: 20,
    record_step_train_evaluation: true,
    entrypoint: experiments/deepscratch1/config/e09_cnn_accuracy.yaml,
  }
evaluation:
  {
    batch_size: 100,
    use_full_train: true,
    use_full_test: true,
    primary_metric: test/accuracy,
    checkpoint_selection: final,
  }
numerics:
  {
    dtype: float64,
    backend: cupy,
    device: cuda:0,
    deterministic: false,
    nan_policy: fail,
    inf_policy: fail,
  }
checkpoint: { save_final: true, save_best: false, format: npz }
profiling: { enabled: false }
policy: { seed_set: research_v1, seed_count: 10, paired_execution: true }
tracking: { enabled: true, experiment: deepscratch1 }
variants:
  CNN-SIMPLE-ACCURACY:
    {
      atomic_run_id: CNN-SIMPLE-ACCURACY,
      experiment_ids: [e09],
      execution_group_id: g10,
      recipe_id: RC-CNN-S-ACCURACY,
      structure_signature: mnist-simpleconvnet-v1,
      dataset: { flatten: false, input_shape: [1, 28, 28] },
      initializer: { name: "std:0.01", fan_mode: fan_in, seed: seed/model_init },
      model:
        {
          alias: SimpleCNN,
          name: SimpleConvNet,
          family: cnn,
          task_type: classification,
          input_shape: [1, 28, 28],
          output_shape: [10],
          num_conv_layers: 1,
          activation: relu,
          normalization: none,
          use_batchnorm: false,
          use_dropout: false,
          input_channels: 1,
          image_size: 28,
          num_classes: 10,
          conv_channels: 30,
          kernel_size: 5,
          stride: 1,
          padding: 0,
          hidden_size: 100,
          initializer: "std:0.01",
        },
    }
  CNN-DEEP-ACCURACY:
    {
      atomic_run_id: CNN-DEEP-ACCURACY,
      experiment_ids: [e09],
      execution_group_id: g10,
      recipe_id: RC-CNN-D-ACCURACY,
      structure_signature: mnist-deepconvnet-v1,
      initializer: { name: he, fan_mode: fan_in, seed: seed/model_init },
      model:
        {
          alias: DeepCNN,
          name: DeepConvNet,
          family: cnn,
          task_type: classification,
          input_shape: [1, 28, 28],
          output_shape: [10],
          num_conv_layers: 6,
          activation: relu,
          normalization: none,
          use_batchnorm: false,
          use_dropout: true,
          input_channels: 1,
          image_size: 28,
          num_classes: 10,
          channels: [16, 32, 64],
          hidden_size: 50,
          dropout_ratio: 0.5,
          initializer: he,
        },
    }
