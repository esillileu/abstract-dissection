kind: supervised_classification
dataset:
  {
    id: DS-MNIST-FLAT,
    name: MNIST,
    version: official,
    flatten: true,
    train_limit: 60000,
    test_limit: 10000,
    input_shape: [784],
    target_shape: [],
    num_classes: 10,
    normalization: pixel_0_1,
  }
loader:
  {
    batch_size: 128,
    shuffle: true,
    drop_last: false,
    sampling_method: with_replacement,
    num_workers: 0,
  }
model:
  {
    alias: MLP,
    name: MLP4Hidden,
    family: mlp,
    task_type: classification,
    input_size: 784,
    hidden_sizes: [100, 100, 100, 100],
    output_size: 10,
    activation: relu,
    input_shape: [784],
    output_shape: [10],
    use_batchnorm: false,
    use_dropout: false,
  }
scheduler: { name: constant }
loss: { name: SoftmaxWithLoss, reduction: mean }
training:
  {
    max_epochs: 5,
    max_updates: 2000,
    record_step_loss: post_update,
    log_interval: 30,
    log_interval_unit: update,
    entrypoint: experiments/deepscratch1/config/e02_mnist_mlp_optimizer.yaml,
  }
evaluation:
  {
    batch_size: 128,
    use_full_train: true,
    use_full_test: true,
    primary_metric: test/accuracy,
    checkpoint_selection: final,
  }
numerics:
  {
    dtype: float64,
    compute_dtype: float64,
    parameter_dtype: float64,
    backend: numpy,
    device: cpu,
    deterministic: false,
    nan_policy: fail,
    inf_policy: fail,
    epsilon: 1.0e-7,
  }
checkpoint:
  {
    save_final: true,
    save_best: false,
    format: npz,
    include_optimizer: false,
    include_scheduler: false,
    include_rng_state: false,
    include_training_state: false,
  }
profiling: { enabled: false }
policy:
  {
    seed_set: research_v1,
    seed_count: 10,
    seed_start: 0,
    paired_execution: true,
    save_final_checkpoint: true,
    fail_on_nan: true,
    fail_on_inf: true,
  }
tracking: { enabled: true, experiment: deepscratch1, upload_checkpoint: false }
variants:
  MLP-SGD-HE:
    {
      atomic_run_id: MLP-SGD-HE,
      experiment_ids: [e02],
      execution_group_id: g02,
      recipe_id: RC-MLP,
      structure_signature: mnist-mlp-784-100x4-10-relu-v1,
      model: { initializer: he },
      initializer: { name: he, fan_mode: fan_in, seed: seed/model_init },
      optimizer: { name: sgd, learning_rate: 0.01 },
    }
  MLP-MOM-HE:
    {
      atomic_run_id: MLP-MOM-HE,
      experiment_ids: [e02],
      execution_group_id: g02,
      recipe_id: RC-MLP,
      structure_signature: mnist-mlp-784-100x4-10-relu-v1,
      model: { initializer: he },
      initializer: { name: he, fan_mode: fan_in, seed: seed/model_init },
      optimizer: { name: momentum, learning_rate: 0.01 },
    }
  MLP-ADAGRAD-HE:
    {
      atomic_run_id: MLP-ADAGRAD-HE,
      experiment_ids: [e02],
      execution_group_id: g02,
      recipe_id: RC-MLP,
      structure_signature: mnist-mlp-784-100x4-10-relu-v1,
      model: { initializer: he },
      initializer: { name: he, fan_mode: fan_in, seed: seed/model_init },
      optimizer: { name: adagrad, learning_rate: 0.01 },
    }
  MLP-ADAM-HE:
    {
      atomic_run_id: MLP-ADAM-HE,
      experiment_ids: [e02],
      execution_group_id: g02,
      recipe_id: RC-MLP,
      structure_signature: mnist-mlp-784-100x4-10-relu-v1,
      model: { initializer: he },
      initializer: { name: he, fan_mode: fan_in, seed: seed/model_init },
      optimizer: { name: adam, learning_rate: 0.001 },
    }
