kind: word2vec
dataset: {id: DS-PTB-TRAIN, name: Penn Treebank, window_size: 5}
loader: {batch_size: 100, shuffle: true}
model: {family: word2vec, embedding_size: 100, negative_samples: 5}
optimizer: {name: adam, learning_rate: 0.001}
scheduler: {name: constant}
loss: {name: normalized_prediction_term_negative_sampling}
training: {max_epochs: 10, log_interval: 1000, entrypoint: experiments/deepbase2/config/e09_cbow_skipgram.yaml}
evaluation: {primary_metric: final/train/normalized_loss}
numerics: {dtype: float32, backend: cupy, device: cuda:0, deterministic: true}
checkpoint: {save_final: true, save_best: false, format: npz}
profiling: {enabled: true}
policy: {seed_set: research_v1, seed_count: 10}
tracking: {enabled: true, experiment: deepbase2}
variants:
  W2V-CBOW-NS:
    atomic_run_id: W2V-CBOW-NS
    experiment_ids: [e09, e10]
    execution_group_id: g10
    recipe_id: RC-PTB-CBOW-NS
    structure_signature: ptb-cbow-negative-sampling-v1
    model: {architecture: cbow, objective: negative_sampling}
  W2V-SG-NS:
    atomic_run_id: W2V-SG-NS
    experiment_ids: [e09]
    execution_group_id: g11
    recipe_id: RC-PTB-SKIPGRAM-NS
    structure_signature: ptb-skipgram-negative-sampling-v1
    model: {architecture: skipgram, objective: negative_sampling}
