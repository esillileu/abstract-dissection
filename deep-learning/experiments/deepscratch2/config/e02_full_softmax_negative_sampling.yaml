kind: word2vec
dataset: {id: DS-PTB-TRAIN, name: Penn Treebank, window_size: 5}
loader: {batch_size: 100, shuffle: true}
model: {family: word2vec, embedding_size: 100, architecture: cbow, objective: full_softmax}
optimizer: {name: adam, learning_rate: 0.001}
scheduler: {name: constant}
loss: {name: summed_prediction_term_full_softmax, reduction: sum}
training: {max_epochs: 10, log_interval: 20, trainer: book_word2vec, entrypoint: experiments/deepscratch2/config/e02_full_softmax_negative_sampling.yaml}
evaluation: {primary_metric: final/train/normalized_loss}
numerics: {dtype: float32, backend: cupy, device: cuda:0, deterministic: true}
checkpoint: {save_final: true, save_best: false, format: npz}
profiling: {enabled: true, num_steps: 0, sample_memory_every_n_steps: 0}
policy: {seed_set: research_v1, seed_count: 10}
tracking: {enabled: true, experiment: deepscratch2}
variants:
  W2V-CBOW-FULL:
    atomic_run_id: W2V-CBOW-FULL
    experiment_ids: [e02]
    execution_group_id: g03
    recipe_id: RC-PTB-CBOW-FULL
    structure_signature: ptb-cbow-full-softmax-v1
  W2V-SG-FULL:
    atomic_run_id: W2V-SG-FULL
    experiment_ids: [e02]
    execution_group_id: g13
    recipe_id: RC-PTB-SKIPGRAM-FULL
    structure_signature: ptb-skipgram-full-softmax-v1
    model: {architecture: skipgram, objective: full_softmax}
