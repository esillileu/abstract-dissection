kind: language_modeling
dataset: {id: DS-PTB, name: Penn Treebank}
loader: {batch_size: 20, time_size: 35}
optimizer: {name: sgd, learning_rate: 20.0}
scheduler: {name: validation_decay, factor: 0.25}
loss: {name: time_softmax_cross_entropy}
training: {max_epochs: 4, log_interval: 20, entrypoint: experiments/deepscratch2/config/e11_rnnlm_comparison.yaml}
evaluation: {primary_metric: final/test/perplexity}
numerics: {dtype: float32, backend: cupy, device: cuda:0, deterministic: true}
checkpoint: {save_final: true, save_best: true, format: npz}
profiling: {enabled: true}
policy: {seed_set: research_v1, seed_count: 10, max_grad: 0.25}
tracking: {enabled: true, experiment: deepscratch2}
variants:
  LM-RNN-C025:
    atomic_run_id: LM-RNN-C025
    experiment_ids: [e11]
    execution_group_id: g13
    recipe_id: RC-PTB-RNN100
    structure_signature: ptb-rnnlm-rnn100-v1
    model: {alias: VanillaRnnlm, wordvec_size: 100, hidden_size: 100}
  LM-LSTM-C025:
    atomic_run_id: LM-LSTM-C025
    experiment_ids: [e11]
    execution_group_id: g14
    recipe_id: RC-PTB-LSTM100
    structure_signature: ptb-rnnlm-lstm100-v1
    model: {alias: Rnnlm, wordvec_size: 100, hidden_size: 100}
  LM-BETTER:
    atomic_run_id: LM-BETTER
    experiment_ids: [e11]
    execution_group_id: g15
    recipe_id: RC-PTB-BETTER-RNNLM
    structure_signature: ptb-better-rnnlm-v1
    model: {alias: BetterRnnlm, wordvec_size: 650, hidden_size: 650, dropout_ratio: 0.5}
    training: {max_epochs: 40}
