kind: seq2seq
dataset: {id: DS-SEQ-ADD, file: addition.txt, name: character addition, reverse: false}
loader: {batch_size: 128, shuffle: true}
optimizer: {name: adam, learning_rate: 0.001}
scheduler: {name: constant}
loss: {name: time_softmax_cross_entropy}
training: {max_epochs: 25, entrypoint: experiments/deepscratch2/config/e12_seq2seq_addition.yaml}
evaluation: {primary_metric: final/test/exact_match, decode: greedy}
numerics: {dtype: float32, backend: cupy, device: cuda:0, deterministic: true}
checkpoint: {save_final: true, save_best: true, format: npz}
profiling: {enabled: true}
policy: {seed_set: research_v1, seed_count: 10, max_grad: 5.0}
tracking: {enabled: true, experiment: deepscratch2}
variants:
  SEQA-VAN-FWD: {atomic_run_id: SEQA-VAN-FWD, experiment_ids: [e12], execution_group_id: g16, recipe_id: RC-ADD-VANILLA, structure_signature: addition-vanilla-seq2seq-v1, model: {alias: Seq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: false}}
  SEQA-VAN-REV: {atomic_run_id: SEQA-VAN-REV, experiment_ids: [e12], execution_group_id: g16, recipe_id: RC-ADD-VANILLA, structure_signature: addition-vanilla-seq2seq-v1, model: {alias: Seq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: true}}
  SEQA-PEEKY-FWD: {atomic_run_id: SEQA-PEEKY-FWD, experiment_ids: [e12], execution_group_id: g17, recipe_id: RC-ADD-PEEKY, structure_signature: addition-peeky-seq2seq-v1, model: {alias: PeekySeq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: false}}
  SEQA-PEEKY-REV: {atomic_run_id: SEQA-PEEKY-REV, experiment_ids: [e12], execution_group_id: g17, recipe_id: RC-ADD-PEEKY, structure_signature: addition-peeky-seq2seq-v1, model: {alias: PeekySeq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: true}}
  SEQA-ATTN-REV: {atomic_run_id: SEQA-ATTN-REV, experiment_ids: [e12], execution_group_id: g18, recipe_id: RC-ADD-ATTENTION, structure_signature: addition-attention-seq2seq-v1, model: {alias: AttentionSeq2seq, wordvec_size: 16, hidden_size: 128}, dataset: {reverse: true}}
