kind: word2vec
dataset: {id: DS-TOY-W2V, name: "You say goodbye and I say hello.", text: "You say goodbye and I say hello.", window_size: 1}
loader: {batch_size: 3, shuffle: false}
model: {family: word2vec, embedding_size: 5, objective: full_softmax}
optimizer: {name: adam, learning_rate: 0.001}
scheduler: {name: constant}
loss: {name: summed_prediction_term_full_softmax, reduction: sum}
training: {max_epochs: 1000, log_interval: 20, trainer: book_word2vec, entrypoint: experiments/deepscratch2/config/e06_word2vec_toy_full_softmax.yaml}
evaluation: {primary_metric: final/train/normalized_loss}
numerics: {dtype: float32, backend: cupy, device: cuda:0, deterministic: true}
checkpoint: {save_final: true, save_best: false, format: npz}
profiling: {enabled: true, num_steps: 0, sample_memory_every_n_steps: 0}
policy: {seed_set: research_v1, seed_count: 10}
tracking: {enabled: true, experiment: deepscratch2}
variants:
  W2V-TOY-CBOW-FULL:
    atomic_run_id: W2V-TOY-CBOW-FULL
    experiment_ids: [e06]
    execution_group_id: g14
    recipe_id: RC-TOY-CBOW-FULL
    structure_signature: toy-cbow-full-softmax-v1
    model: {architecture: cbow, objective: full_softmax}
  W2V-TOY-SG-FULL:
    atomic_run_id: W2V-TOY-SG-FULL
    experiment_ids: [e06]
    execution_group_id: g15
    recipe_id: RC-TOY-SKIPGRAM-FULL
    structure_signature: toy-skipgram-full-softmax-v1
    model: {architecture: skipgram, objective: full_softmax}
